name: publish

# Publishes to npm via OIDC trusted publishing — no token stored anywhere.
# One-time setup on npmjs.com: package Settings -> Trusted Publisher ->
# GitHub Actions -> owner That1Drifter, repo browse-mcp, workflow publish.yml.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # OIDC trusted publishing requires npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish
